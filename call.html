<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハタボ 電話</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16233F">
<style>
/* 11/23 電話をLINEに近く：まんなかに相手のアイコンと名前・時間、下に丸いボタン（スピーカー・ミュート・切る） */
:root{--bg:#1B2433;--bg2:#0E141F;--ink:#fff;--sub:#AAB4C5;--hb:#2FB463;--end:#F04B4B;--btn:rgba(255,255,255,.16);--btnon:#fff;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 25%,#2A3954 0,var(--bg) 45%,var(--bg2) 100%);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
main{min-height:100%;max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);min-height:24px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.who{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:9vh 0 16px}
.face{width:112px;height:112px;border-radius:50%;background:#4B5A73;display:grid;place-items:center;font-size:46px;font-weight:800;position:relative;overflow:visible}
.face img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.face.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.35);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.face.ring::after{animation:none}}
.name{font-size:26px;font-weight:800;margin:20px 0 4px;letter-spacing:.02em}
.time{font-variant-numeric:tabular-nums;font-size:17px;color:#fff;min-height:1.6em}
.state{color:var(--sub);font-size:14.5px;min-height:1.6em;margin-top:2px}
.note{margin-top:14px;font-size:12.5px;color:var(--sub);line-height:1.7;max-width:320px}
.setup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
.setup label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.setup label:first-child{margin-top:0}
.setup input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.2);color:var(--ink);font-size:16px;-webkit-user-select:text;user-select:text}
.share{display:flex;gap:8px;margin-top:12px}
.share button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px;font-size:14px;cursor:pointer}
.link{font-size:12px;color:var(--sub);word-break:break-all;margin-top:8px}
.bar{display:flex;justify-content:space-evenly;gap:12px;align-items:flex-start;padding:0 4px 6px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:76px;font-size:12.5px;color:#fff;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
.ctl i{width:72px;height:72px;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:transform .1s}
.ctl:active i{transform:scale(.94)}
.ctl svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl.on i{background:var(--btnon)} .ctl.on svg{stroke:#1B2433}
.ctl.call i{background:var(--hb)} .ctl.end i{background:var(--end)}
.ctl:disabled{opacity:.45;cursor:default}
.ctl:focus-visible i{outline:3px solid #F7E3A8;outline-offset:3px}
.diag{margin-top:14px;font-size:11.5px;color:var(--sub);text-align:center;min-height:1.4em}
.inline{display:grid;gap:8px;margin:14px 0 0;padding:14px;border-radius:16px;background:#F7E3A8;color:#16233F;font-size:14px}
.inline b{font-size:15px}.inline .go,.inline .cp{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;font:800 15px/1 inherit;text-decoration:none;border:0;cursor:pointer}
.inline .go{background:#16233F;color:#fff}.inline .cp{background:rgba(22,35,63,.1);color:#16233F}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><span>ハタボ 電話</span><span class="tag" id="testTag" hidden>合言葉のテスト</span></div>
  <!-- 11/23：友だちからの電話（切符つき）では「試し」を出さない。合言葉で入るテストのときだけ右上に出す -->
  <div class="inline" id="inLine" hidden><b>LINEの中では、マイクが使えないことがあります</b><span>下のボタンで Safari に切りかえて「出る」を押してください。</span><a class="go" id="extBtn" href="#">Safariで開く</a><button type="button" class="cp" id="copyBtn">リンクをコピー（Safariに貼る）</button></div>

  <div class="who">
    <div class="face" id="face" aria-hidden="true">?</div>
    <div class="name" id="peerName">相手を待っています</div>
    <div class="time" id="time"></div>
    <div class="state" id="state" aria-live="polite">リンクを相手に送って、ふたりで「かける」を押してください</div>
    <!-- 11/23：Webの通話でできないこと（画面を消しても続ける・ロック画面・近づくと消える・Bluetoothの選択・iPhoneのスピーカー切りかえ）の案内 -->
    <div class="note" id="note" hidden>通話中は、この画面を開いたままにしてください（画面を消したり、ほかのアプリにすると切れることがあります）。</div>
    <div class="note" id="volHint" hidden>音が小さいときは、本体の横の音量ボタンで大きくしてください。iPhoneのブラウザでは、スピーカーと受話口の切りかえはできません。</div>
  </div>

  <div class="setup" id="setup">
    <label for="me">あなたの呼び名</label>
    <input id="me" autocomplete="nickname" placeholder="例：ヒロ" maxlength="20">
    <label for="key">合言葉</label>
    <input id="key" type="password" autocomplete="off">
    <div class="share">
      <button type="button" id="shareBtn">相手にリンクを送る</button>
      <button type="button" id="newBtn">新しい部屋</button>
    </div>
    <div class="link" id="link"></div>
  </div>

  <div class="bar">
    <button class="ctl" id="spkBtn" type="button" hidden aria-pressed="false">
      <i><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></i><span>スピーカー</span>
    </button>
    <button class="ctl" id="muteBtn" type="button" hidden aria-pressed="false">
      <i><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path id="muteX" d="M4 4l16 16" hidden/></svg></i><span id="muteTx">ミュート</span>
    </button>
    <button class="ctl end" id="declineBtn" type="button" hidden>
      <i><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></i><span>切る</span>
    </button>
    <button class="ctl call" id="callBtn" type="button">
      <i><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></i><span>かける</span>
    </button>
    <button class="ctl end" id="endBtn" type="button" hidden>
      <i><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></i><span>切る</span>
    </button>
  </div>
  <div class="diag" id="diag"></div>
  <audio id="remote" autoplay playsinline></audio>
</main>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  // 11/22 安全：つなぐサーバーは本番の Cloud Run だけ（手元の localhost で開いたときだけ localhost も）。URLの ?s= で別の所にされて、合言葉や切符が送られないように
  const HOST0 = 'butter-junior-722073142596.asia-northeast1.run.app', s0 = String(P.get('s') || '').replace(/^(wss?|https?):\/\//, '').replace(/\/.*$/, '');
  const host = s0 && (s0 === HOST0 || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^(localhost|127\.0\.0\.1)(:\d+)?$/.test(s0))) ? s0 : HOST0;
  const http = (/^(localhost|127\.)/.test(host) ? 'http://' : 'https://') + host;
  const wsBase = (/^(localhost|127\.)/.test(host) ? 'ws://' : 'wss://') + host;
  const $ = id => document.getElementById(id);
  const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const newRoom = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  let room = (P.get('room') || '').toLowerCase();
  if (!/^[a-z0-9]{6,16}$/.test(room)) { room = newRoom(); P.set('room', room); history.replaceState(null, '', '?' + P.toString()); }
  // 11/23（着信の不具合）：前は state を下で定義していたので、切符つき（友だちからの電話）で開くと、上の if (T) の中の state(…) が
  // 「定義の前に使った」エラーになり、そこでスクリプトが止まって「出る」「かける」に何もつかなかった（押しても何も起きない）
  const state = t => { $('state').textContent = t; };
  const diag = t => { $('diag').textContent = t; };
  const T = P.get('t') || '', ROLE = P.get('r') || '';   // アプリから：友だちどうしの電話（合言葉の代わりに切符）
  $('testTag').hidden = !!T;   // 「合言葉のテスト」は、切符なし（合言葉で入る）ときだけ
  if (!T) document.title = 'ハタボ 電話（合言葉のテスト）';
  // 11/23：iPhoneのLINEの中のブラウザでは、マイクの許可が出ないことがある（「出る」を押しても進まない）。Safariに切りかえる道を、はじめから見せる
  const IN_LINE = / Line\//i.test(navigator.userAgent) && /iPhone|iPad|iPod/.test(navigator.userAgent);
  const extUrl = () => { const q = new URLSearchParams(location.search); q.set('openExternalBrowser', '1'); return location.origin + location.pathname + '?' + q.toString(); };
  if (IN_LINE) {
    $('inLine').hidden = false; $('extBtn').href = extUrl();
    $('copyBtn').onclick = async () => { const u = location.href.replace(/([?&])openExternalBrowser=1&?/, '$1').replace(/[?&]$/, ''); try { await navigator.clipboard.writeText(u); $('copyBtn').textContent = 'コピーしました。Safariのアドレス欄に貼ってください'; } catch (e) { prompt('このリンクをコピーして、Safariで開いてください', u); } };
  }
  $('key').value = P.get('k') || get('callKey');
  $('me').value = P.get('n') || get('callName');
  if (T) {
    $('setup').hidden = true; $('newBtn').hidden = true;
    const peer = (P.get('p') || '相手').slice(0, 20); $('peerName').textContent = peer; setFace0(peer);
    document.querySelector('#callBtn span').textContent = ROLE === 'in' ? '出る' : 'かける';
    $('declineBtn').hidden = ROLE !== 'in';   // かかってきた側：LINEのように「切る」（赤）と「出る」（緑）
    if (ROLE === 'in') $('face').classList.add('ring');
    state(ROLE === 'in' ? peer + 'さんから電話です。「出る」を押してください' : '「かける」を押すと、' + peer + 'さんを呼び出します');
  }
  function setFace0(n) { const f = document.getElementById('face'); if (!f) return; const ic = P.get('i') || ''; if (/^https:\/\/[\w.-]+\.line-scdn\.net\//.test(ic)) { const im = document.createElement('img'); im.alt = ''; im.src = ic; im.onerror = () => { f.textContent = (n || '?').slice(0, 1); }; f.textContent = ''; f.append(im); } else f.textContent = (n || '?').slice(0, 1); }   // 相手のLINEのアイコン（LINEの画像の所だけ）

  let ws = null, pc = null, mic = null, muted = false, t0 = 0, tick = null, ice = null, pend = [], peerName = '', ended = false, wake = null, sinkIdx = 0;
  // 11/23：iPhone（iPadも）では、Webから音の出口（スピーカー／受話口）を選べない（setSinkId がない）。ボタンは出さず、音量ボタンの案内にする
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
  const CAN_SINK = !IS_IOS && typeof HTMLMediaElement !== 'undefined' && 'setSinkId' in HTMLMediaElement.prototype;
  // 画面が消えないように（Wake Lock）。使えない端末では何もしない
  async function wakeOn() { try { if (!wake && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
  function wakeOff() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ws && !ended) wakeOn(); });
  /** 通話が終わった（自分が切った・相手が切った・出られなかった）。切符が1回だけのことがあるので、かけなおしはアプリから */
  function finish(msg) {
    ended = true; stopAll(); state(msg); diag('');
    if (T) { $('callBtn').hidden = true; $('declineBtn').hidden = true; $('note').hidden = true; $('volHint').hidden = true; $('time').textContent = '通話終了'; }
  }
  const shareUrl = () => { const q = new URLSearchParams({ room }); if (host !== HOST0) q.set('s', host); return location.origin + location.pathname + '?' + q.toString(); };
  $('link').textContent = shareUrl() + '（合言葉は別に伝えてください）';

  $('shareBtn').onclick = async () => {
    const url = shareUrl(), text = 'ハタボの電話（合言葉のテスト）です。ひらいて「かける」を押してね';
    try { if (navigator.share) { await navigator.share({ title: 'ハタボ 電話', text, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); state('リンクをコピーしました'); } catch (e) { state('リンクを長押しでコピーしてください'); }
  };
  $('newBtn').onclick = () => { if (ws) return; room = newRoom(); P.set('room', room); history.replaceState(null, '', '?' + P.toString()); $('link').textContent = shareUrl() + '（合言葉は別に伝えてください）'; state('新しい部屋にしました'); };

  function setFace(n) { $('face').textContent = (n || '?').slice(0, 1); }
  function clock() { const s = Math.floor((Date.now() - t0) / 1000); $('time').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function ui(on) {
    $('callBtn').hidden = on; $('endBtn').hidden = !on; $('muteBtn').hidden = !on; $('spkBtn').hidden = !on || !CAN_SINK;
    $('declineBtn').hidden = on || ROLE !== 'in' || !T || ended;
    $('note').hidden = !on; $('volHint').hidden = !on || !IS_IOS;
    $('setup').hidden = on || !!T; $('newBtn').disabled = on;
    if (on) wakeOn(); else wakeOff();
  }
  const send = o => { try { ws && ws.readyState === 1 && ws.send(JSON.stringify(o)); } catch (e) {} };

  async function start() {
    const k = $('key').value.trim(), me = $('me').value.trim();
    if (!k && !T) { state('合言葉を入れてください'); $('key').focus(); return; }
    if (!T) { put('callKey', k); put('callName', me); }
    $('callBtn').disabled = true; state('マイクを準備しています');
    // 11/23：マイクの許可が出ないまま待ち続けると、ボタンが押せないままになる。12秒で切りあげて、もう一度押せるようにする
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
      const gp = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      let tm = 0;
      try { mic = await Promise.race([gp, new Promise((_, ng) => { tm = setTimeout(() => { gp.then(st => st.getTracks().forEach(t => t.stop())).catch(() => {}); ng(new Error('timeout')); }, 12000); })]); }
      finally { clearTimeout(tm); }
    }
    catch (e) { $('callBtn').disabled = false; if (IN_LINE) $('inLine').hidden = false; state(IN_LINE ? 'LINEの中ではマイクが使えませんでした。下の「Safariで開く」から出てください' : e.message === 'timeout' ? 'マイクの許可が出ませんでした。もう一度押すか、ブラウザの設定でマイクを許可してください' : 'マイクが使えません。ブラウザの設定でマイクを許可してください'); return; }
    const r = await fetch(http + '/call/ice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(T ? { t: T, room } : { k }) }).catch(() => null);
    if (!r || !r.ok) { stopAll(); $('callBtn').disabled = false; state(r && r.status === 403 ? '合言葉がちがいます' : 'サーバーにつながりません'); return; }
    ice = await r.json();
    diag(ice.turn ? '中継：Cloudflare' : '中継なし（STUNだけ）');
    ws = new WebSocket(wsBase + '/call?room=' + encodeURIComponent(room) + (T ? '&t=' + encodeURIComponent(T) : '&k=' + encodeURIComponent(k)));
    ws.onmessage = e => onMsg(JSON.parse(e.data)).catch(err => { console.error(err); state('うまくつながりませんでした'); });
    ws.onclose = e => {
      const why = { 4003: T ? '電話の切符の期限が切れました。もう一度かけてください' : '合言葉がちがいます', 4009: 'この部屋はもう2人います', 4029: '少し待ってからもう一度', 4008: '1時間たったので切れました' }[e.code];
      if (ws) { stopAll(); state(why || '切れました'); }
    };
    ws.onopen = () => { ui(true); $('callBtn').disabled = false; send({ type: 'hello', name: me }); };
  }

  function makePc() {
    pc = new RTCPeerConnection({ iceServers: ice.iceServers });
    mic.getTracks().forEach(t => pc.addTrack(t, mic));
    pc.ontrack = e => { $('remote').srcObject = e.streams[0]; $('remote').play().catch(() => {}); };
    pc.onicecandidate = e => { if (e.candidate) send({ type: 'ice', c: e.candidate }); };
    pc.onconnectionstatechange = () => {
      const s = pc && pc.connectionState;
      if (s === 'connected') { $('face').classList.remove('ring'); state('通話中'); t0 = Date.now(); clearInterval(tick); tick = setInterval(clock, 1000); clock(); route(); }
      else if (s === 'disconnected') state('電波が弱いようです…');
      else if (s === 'failed') { state('つながりませんでした（中継のキーが入っているか確かめてください）'); }
    };
  }
  async function route() {
    try {
      const st = await pc.getStats(); let pair = null, loc = {};
      st.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; if (r.type === 'local-candidate') loc[r.id] = r; });
      const c = pair && loc[pair.localCandidateId];
      if (c) diag(c.candidateType === 'relay' ? '中継（Cloudflare）でつながっています' : 'じかにつながっています（' + c.candidateType + '）');
    } catch (e) {}
  }
  async function flush() { for (const c of pend.splice(0)) await pc.addIceCandidate(c).catch(() => {}); }

  async function onMsg(m) {
    if (m.type === 'joined') { $('face').classList.add('ring'); state(m.peers > 1 ? 'つないでいます…' : T ? '呼び出しています…（相手が出るのを待っています）' : '相手を待っています（リンクを送ってね）'); }
    else if (m.type === 'hello') { peerName = String(m.name || '相手').slice(0, 20); $('peerName').textContent = peerName; setFace(peerName); }
    else if (m.type === 'peer') {   // 相手が入ってきた → こちらからかける
      send({ type: 'hello', name: $('me').value.trim() });
      if (pc) { pc.close(); pc = null; }
      makePc(); state('呼び出しています…');
      await pc.setLocalDescription(await pc.createOffer());
      send({ type: 'offer', sdp: pc.localDescription });
    }
    else if (m.type === 'offer') {
      if (pc) { pc.close(); pc = null; }
      makePc(); await pc.setRemoteDescription(m.sdp); await flush();
      await pc.setLocalDescription(await pc.createAnswer());
      send({ type: 'answer', sdp: pc.localDescription });
    }
    else if (m.type === 'answer' && pc) { await pc.setRemoteDescription(m.sdp); await flush(); }
    else if (m.type === 'ice') { if (pc && pc.remoteDescription) await pc.addIceCandidate(m.c).catch(() => {}); else pend.push(m.c); }
    else if (m.type === 'mute') state(m.on ? (peerName || '相手') + 'さんがミュートにしました' : '通話中');
    else if (m.type === 'bye') finish((peerName || '相手') + 'さんが切りました。通話が終わりました');   // 11/23：切ったら相手にも終わりが伝わる
    else if (m.type === 'declined') finish((m.name || peerName || '相手') + 'さんは出られませんでした');
    else if (m.type === 'left') {   // 電波が切れたなど（「切る」ではない）
      if (pc) { pc.close(); pc = null; } clearInterval(tick); $('time').textContent = '';
      $('face').classList.add('ring'); state('相手の電波が切れました。少し待つと、またつながることがあります'); diag('');
    }
  }

  function stopAll() {
    clearInterval(tick); $('time').textContent = '';
    if (pc) { pc.close(); pc = null; }
    if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; }
    const w = ws; ws = null; if (w) try { w.close(); } catch (e) {}
    pend = []; muted = false; $('muteBtn').classList.remove('on'); $('muteBtn').setAttribute('aria-pressed', 'false'); $('muteX').hidden = true; $('muteTx').textContent = 'ミュート';
    $('face').classList.remove('ring'); ui(false); wakeOff();
    try { const a = $('remote'); a.srcObject = null; } catch (e) {}
  }

  $('callBtn').onclick = start;
  $('endBtn').onclick = () => { send({ type: 'bye' }); finish('通話が終わりました'); };
  // 出る前に「切る」：かけた人に「出られませんでした」を返して、呼び出しを止める
  $('declineBtn').onclick = () => {
    fetch(http + '/call/decline', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: T, room }), keepalive: true }).catch(() => {});
    $('face').classList.remove('ring'); finish('電話を切りました');
  };
  // スピーカー（Android・パソコンで、音の出口を選べるときだけ）：出口を順に切りかえる
  $('spkBtn').onclick = async () => {
    try {
      const outs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput');
      if (outs.length < 2) { diag('この端末では、音の出口を切りかえられません。音量ボタンで調整してください'); return; }
      const sp = outs.findIndex(d => /speaker|スピーカー/i.test(d.label));
      sinkIdx = sinkIdx === 0 && sp > 0 ? sp : (sinkIdx + 1) % outs.length;
      await $('remote').setSinkId(outs[sinkIdx].deviceId);
      $('spkBtn').classList.toggle('on', sinkIdx !== 0); $('spkBtn').setAttribute('aria-pressed', String(sinkIdx !== 0));
      diag('音の出口：' + (outs[sinkIdx].label || (sinkIdx ? 'ほかの出口' : 'ふつう')));
    } catch (e) { diag('音の出口を切りかえられませんでした'); }
  };
  $('muteBtn').onclick = () => {
    if (!mic) return; muted = !muted; mic.getAudioTracks().forEach(t => { t.enabled = !muted; });
    $('muteBtn').classList.toggle('on', muted); $('muteBtn').setAttribute('aria-pressed', String(muted)); $('muteX').hidden = !muted;
    $('muteTx').textContent = muted ? 'ミュート中' : 'ミュート'; send({ type: 'mute', on: muted });
  };
  window.addEventListener('pagehide', () => { if (ws && !ended) send({ type: 'bye' }); });
})();
</script>
</body>
</html>
